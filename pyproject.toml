[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honestledger"
version = "0.1.0"
description = "The reconciliation agent that keeps itself honest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-genai>=1.0.0",
    "google-adk>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "openinference-instrumentation-google-genai>=0.1.0",
    "openinference-instrumentation-google-adk>=0.1.0",
    "arize-phoenix-otel>=0.6.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
